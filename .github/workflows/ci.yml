name: CI

on:
  pull_request:
  push:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: generate
        uses: freckle/stack-action/generate-matrix@v5
    outputs:
      stack-yamls: ${{ steps.generate.outputs.stack-yamls }}

  test:
    needs: generate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        stack-yaml: ${{ fromJSON(needs.generate.outputs.stack-yamls) }}
      fail-fast: false

    # Nightly is not a merge gate
    continue-on-error: ${{ matrix.stack-yaml == 'stack-nightly.yaml' }}

    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get install --assume-yes --no-install-recommends binutils librdkafka-dev
      - name: Debug linker (temporary)
        run: |
          echo "PATH=$PATH"
          which -a ld ld.bfd ld.gold ld.lld gcc || true
          ls -l /usr/bin/*ld* /usr/bin/x86_64-linux-gnu-ld* 2>&1 || true
          gcc -print-prog-name=ld || true
          gcc -print-search-dirs || true
          dpkg -l | grep -E 'binutils|gcc|gold' || true
          echo 'int main(){return 0;}' > /tmp/t.c && gcc /tmp/t.c -o /tmp/t && echo "plain gcc link OK" || echo "plain gcc link FAILED"
      - id: stack
        uses: freckle/stack-action@v5
        env:
          STACK_YAML: ${{ matrix.stack-yaml }}

  check:
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/hlint-setup@v2
      - uses: haskell-actions/hlint-run@v2
        with:
          fail-on: warning
